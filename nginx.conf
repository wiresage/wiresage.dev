# Server block for the static site. The Dockerfile installs it as
# /etc/nginx/conf.d/default.conf, replacing the image's stock server.
server {
    listen 8080;   # non-root, so no port 80
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;   # keep redirects relative, so they survive a port mapping or proxy

    # nginx compresses only text/html by default. HTML is always covered.
    gzip on;
    gzip_vary on;
    gzip_types text/css image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # HTML and CSS: always revalidate (cheap 304s), so a redeploy shows up at once.
    expires -1;

    # Logos and icons are not fingerprinted and rarely change: cache for a week.
    location /assets/ {
        expires 7d;
    }
}
